<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body>
<script src="../src/three.bundle.js"></script>
<script src="../src/bike.js"></script>
<script src="../src/studio.js"></script>
<script>
let renderer, studio, camera, bike, currentType = null;

window.setup = function (w, h) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  document.body.appendChild(canvas);
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  studio = MAXBIKE.createStudio(THREE, renderer, { background: 0x08090a });
  camera = new THREE.PerspectiveCamera(38, w / h, 0.05, 60);
  return true;
};

window.loadBike = function (cfg) {
  if (bike) { studio.scene.remove(bike); bike.userData.dispose(); }
  bike = MAXBIKE.createBike(THREE, cfg);
  currentType = cfg.type;
  studio.scene.add(bike);
  return true;
};

/* fundo: escuro (produto) ou claro (catalogo) */
window.setBackground = function (hex, exposure) {
  studio.scene.background = hex === null ? null : new THREE.Color(hex);
  renderer.toneMappingExposure = exposure || 1.05;
  return true;
};

window.aim = function (px, py, pz, tx, ty, tz, fov) {
  camera.position.set(px, py, pz);
  camera.lookAt(tx, ty, tz);
  camera.fov = fov; camera.updateProjectionMatrix();
  return true;
};

window.spin = function (wheelAng, crankAng, yaw) {
  bike.userData.wheels.forEach((w) => (w.rotation.z = wheelAng));
  bike.userData.cranks.rotation.z = crankAng;
  bike.rotation.y = yaw || 0;
  return true;
};

window.setEnvRotation = function (a, intensity) {
  studio.scene.environmentRotation = new THREE.Euler(0, a, 0);
  studio.scene.environmentIntensity = intensity;
  return true;
};

window.setKeyLight = function (x, y, z, intensity) {
  studio.lights.key.position.set(x, y, z);
  studio.lights.key.intensity = intensity;
  return true;
};

window.grab = function (quality) {
  renderer.render(studio.scene, camera);
  return renderer.domElement.toDataURL('image/jpeg', quality || 0.92);
};
</script>
</body>
</html>
